<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Vanilla TypeScript</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-indigo-600">
                <svg class="w-6 h-6 fill-indigo-100" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <h1 class="text-xl font-bold tracking-tight">TaskFlow (Vanilla TS)</h1>
            </div>
            
            <!-- 通知ベルアイコン -->
            <div class="relative">
                <button id="notification-btn" class="p-2 rounded-full hover:bg-slate-100 transition-colors relative">
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                    <span id="notification-badge" class="absolute top-1 right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white ring-2 ring-white hidden">0</span>
                </button>

                <!-- 通知ドロップダウン -->
                <div id="notification-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden z-50">
                    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 bg-slate-50">
                        <span class="font-semibold text-sm">通知</span>
                        <button id="clear-notifications-btn" class="text-xs text-slate-500 hover:text-slate-700">すべてクリア</button>
                    </div>
                    <div id="notification-list" class="max-h-80 overflow-y-auto">
                        <div class="p-4 text-center text-sm text-slate-500">通知はありません</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <!-- タスク追加フォーム -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-8">
            <form id="task-form" class="flex flex-col gap-4">
                <div>
                    <input
                        type="text"
                        id="task-title-input"
                        placeholder="新しいタスクを入力..."
                        class="w-full text-lg font-medium bg-transparent border-0 border-b-2 border-slate-100 focus:border-indigo-500 focus:ring-0 px-0 py-2 placeholder:text-slate-300 transition-colors"
                        required
                    />
                </div>
                <div class="flex flex-wrap gap-4 items-end">
                    <div class="flex-1 min-w-[200px]">
                        <label class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 mb-1.5">
                            締め切り日時 <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="datetime-local"
                            id="task-due-input"
                            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                            required
                        />
                    </div>
                    <div class="flex-1 min-w-[200px]">
                        <label class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 mb-1.5">
                            メモ (任意)
                        </label>
                        <input
                            type="text"
                            id="task-memo-input"
                            placeholder="詳細やリンクなど"
                            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                        />
                    </div>
                    <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-lg flex items-center gap-2 transition-colors h-[42px]"
                    >
                        <span>追加</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- 未完了タスク一覧 -->
        <section class="mb-10">
            <h2 class="text-sm font-bold text-slate-400 mb-3 ml-1 flex items-center gap-2">
                未完了タスク
                <span id="uncompleted-count" class="bg-slate-200 text-slate-600 py-0.5 px-2 rounded-full text-xs">0</span>
            </h2>

            <div id="uncompleted-task-list" class="flex flex-col gap-3">
                <!-- 動的生成 -->
            </div>
        </section>

        <!-- 完了済みタスクセクション -->
        <section id="completed-section" class="hidden">
            <button 
                id="toggle-completed-btn"
                class="w-full flex items-center justify-between p-4 bg-slate-200/50 hover:bg-slate-200 text-slate-600 rounded-xl font-medium transition-colors"
            >
                <div class="flex items-center gap-2">
                    <span id="completed-count-label">完了済みタスク (0)</span>
                </div>
                <svg id="completed-chevron" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>

            <div id="completed-task-list" class="mt-3 flex flex-col gap-2 pl-2 border-l-2 border-slate-200 ml-2 hidden">
                <!-- 動的生成 -->
            </div>
        </section>
    </main>

    <!-- 編集モーダル -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
                <h3 class="font-bold text-slate-700">タスクの編集</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-200 transition-colors">✕</button>
            </div>
            
            <form id="edit-form" class="p-5 flex flex-col gap-4">
                <input type="hidden" id="edit-id" />
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">タイトル <span class="text-red-500">*</span></label>
                    <input type="text" id="edit-title" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" required />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">締め切り日時 <span class="text-red-500">*</span></label>
                    <input type="datetime-local" id="edit-due" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" required />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">メモ</label>
                    <textarea id="edit-memo" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 min-h-[80px]"></textarea>
                </div>
                <div class="mt-4 flex gap-3 justify-end">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2 font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">キャンセル</button>
                    <button type="submit" class="px-4 py-2 font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // TypeScript/JavaScript application runtime
        interface Task {
            id: string;
            title: string;
            memo: string;
            dueAt: string;
            completed: boolean;
            completedAt?: string;
            remindBefore: number[];
            notified: number[];
            createdAt: string;
        }

        interface AppNotification {
            id: string;
            taskId: string;
            message: string;
            read: boolean;
            createdAt: string;
        }

        // 状態管理
        let tasks: Task[] = JSON.parse(localStorage.getItem('taskManager_tasks') || '[]');
        let notifications: AppNotification[] = JSON.parse(localStorage.getItem('taskManager_notifications') || '[]');
        let isCompletedExpanded = false;

        // ローカル時間文字列の生成（input type="datetime-local"用）
        function getNowLocalString(): string {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        // 初期セット
        document.getElementById('task-due-input')!.setAttribute('value', getNowLocalString());

        // 通知権限の要求
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // 保存ヘルパー
        function saveToStorage() {
            localStorage.setItem('taskManager_tasks', JSON.stringify(tasks));
            localStorage.setItem('taskManager_notifications', JSON.stringify(notifications));
            render();
        }

        // 残り時間計算
        function calculateTimeRemaining(dueAtStr: string) {
            const now = new Date().getTime();
            const due = new Date(dueAtStr).getTime();
            const diffMs = due - now;

            if (diffMs < 0) {
                return { text: "期限切れ", status: "expired" };
            }

            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffHours < 24) {
                if (diffMins < 60) return { text: `あと${diffMins}分`, status: "urgent" };
                return { text: `あと${diffHours}時間`, status: "urgent" };
            }
            
            return { text: `あと${diffDays}日${diffHours % 24}時間`, status: "normal" };
        }

        // フォーム送信（タスク追加）
        document.getElementById('task-form')!.addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('task-title-input') as HTMLInputElement;
            const dueInput = document.getElementById('task-due-input') as HTMLInputElement;
            const memoInput = document.getElementById('task-memo-input') as HTMLInputElement;

            if (!titleInput.value.trim() || !dueInput.value) return;

            const newTask: Task = {
                id: Math.random().toString(36).substring(2, 9) + Date.now().toString(36),
                title: titleInput.value.trim(),
                memo: memoInput.value.trim(),
                dueAt: new Date(dueInput.value).toISOString(),
                completed: false,
                remindBefore: [1440, 60], // 24時間前と1時間前
                notified: [],
                createdAt: new Date().toISOString()
            };

            tasks.push(newTask);
            titleInput.value = '';
            memoInput.value = '';
            dueInput.value = getNowLocalString();
            saveToStorage();
        });

        // タスク操作のグローバル関数
        (window as any).toggleTask = (id: string) => {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    const nextCompleted = !t.completed;
                    return { ...t, completed: nextCompleted, completedAt: nextCompleted ? new Date().toISOString() : undefined };
                }
                return t;
            });
            saveToStorage();
        };

        (window as any).deleteTask = (id: string) => {
            tasks = tasks.filter(t => t.id !== id);
            notifications = notifications.filter(n => n.taskId !== id);
            saveToStorage();
        };

        (window as any).openEditModal = (id: string) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            const localIso = new Date(task.dueAt);
            localIso.setMinutes(localIso.getMinutes() - localIso.getTimezoneOffset());

            (document.getElementById('edit-id') as HTMLInputElement).value = task.id;
            (document.getElementById('edit-title') as HTMLInputElement).value = task.title;
            (document.getElementById('edit-due') as HTMLInputElement).value = localIso.toISOString().slice(0, 16);
            (document.getElementById('edit-memo') as HTMLTextAreaElement).value = task.memo;

            document.getElementById('edit-modal')!.classList.remove('hidden');
        };

        document.getElementById('cancel-edit-btn')!.addEventListener('click', () => {
            document.getElementById('edit-modal')!.classList.add('hidden');
        });
        document.getElementById('close-modal-btn')!.addEventListener('click', () => {
            document.getElementById('edit-modal')!.classList.add('hidden');
        });

        document.getElementById('edit-form')!.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = (document.getElementById('edit-id') as HTMLInputElement).value;
            const title = (document.getElementById('edit-title') as HTMLInputElement).value;
            const due = (document.getElementById('edit-due') as HTMLInputElement).value;
            const memo = (document.getElementById('edit-memo') as HTMLTextAreaElement).value;

            tasks = tasks.map(t => t.id === id ? {
                ...t,
                title: title.trim(),
                dueAt: new Date(due).toISOString(),
                memo: memo.trim()
            } : t);

            document.getElementById('edit-modal')!.classList.add('hidden');
            saveToStorage();
        });

        // 通知開閉とクリア
        const notificationBtn = document.getElementById('notification-btn')!;
        const notificationDropdown = document.getElementById('notification-dropdown')!;

        notificationBtn.addEventListener('click', () => {
            notificationDropdown.classList.toggle('hidden');
            if (!notificationDropdown.classList.contains('hidden')) {
                notifications = notifications.map(n => ({ ...n, read: true }));
                saveToStorage();
            }
        });

        document.getElementById('clear-notifications-btn')!.addEventListener('click', () => {
            notifications = [];
            saveToStorage();
        });

        // 完了済みセクションの折りたたみ切り替え
        document.getElementById('toggle-completed-btn')!.addEventListener('click', () => {
            isCompletedExpanded = !isCompletedExpanded;
            const list = document.getElementById('completed-task-list')!;
            const chevron = document.getElementById('completed-chevron')!;
            if (isCompletedExpanded) {
                list.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                list.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        });

        // 1分ごとのリマインダー監視ループ
        setInterval(() => {
            const now = new Date().getTime();
            let updated = false;

            tasks.forEach(task => {
                if (task.completed) return;
                const dueTime = new Date(task.dueAt).getTime();

                task.remindBefore.forEach(remindMin => {
                    const triggerTime = dueTime - (remindMin * 60 * 1000);
                    if (now >= triggerTime && !task.notified.includes(remindMin)) {
                        const timeText = remindMin >= 60 ? `${remindMin / 60}時間` : `${remindMin}分`;
                        const msg = `タスク「${task.title}」の締め切りが約${timeText}後に迫っています。`;

                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification("タスクリマインダー", { body: msg });
                        }

                        notifications.unshift({
                            id: Math.random().toString(36).substring(2, 9),
                            taskId: task.id,
                            message: msg,
                            read: false,
                            createdAt: new Date().toISOString()
                        });

                        task.notified.push(remindMin);
                        updated = true;
                    }
                });
            });

            if (updated) saveToStorage();
        }, 60000);

        // 描画エンジン (Render)
        function render() {
            // 未完了タスクのソート（締め切りが近い順）
            const uncompleted = tasks.filter(t => !t.completed).sort((a, b) => new Date(a.dueAt).getTime() - new Date(b.dueAt).getTime());
            const completed = tasks.filter(t => t.completed).sort((a, b) => new Date(b.completedAt || 0).getTime() - new Date(a.completedAt || 0).getTime());

            // カウント更新
            document.getElementById('uncompleted-count')!.textContent = uncompleted.length.toString();
            
            // 未完了リストの描画
            const uncompletedListEl = document.getElementById('uncompleted-task-list')!;
            if (uncompleted.length === 0) {
                uncompletedListEl.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 border-dashed text-slate-400">
                        <p>すべてのタスクが完了しています！素晴らしいです👏</p>
                    </div>`;
            } else {
                uncompletedListEl.innerHTML = uncompleted.map(task => {
                    const { text: timeText, status: timeStatus } = calculateTimeRemaining(task.dueAt);
                    let cardStyle = "bg-white border-slate-200 hover:border-slate-300";
                    let badgeStyle = "bg-slate-100 text-slate-600";

                    if (timeStatus === 'expired') {
                        cardStyle = "bg-red-50 border-red-200 shadow-sm shadow-red-100/50";
                        badgeStyle = "bg-red-500 text-white shadow-sm shadow-red-200";
                    } else if (timeStatus === 'urgent') {
                        cardStyle = "bg-orange-50/50 border-orange-200 shadow-sm shadow-orange-100/50";
                        badgeStyle = "bg-orange-500 text-white shadow-sm shadow-orange-200";
                    }

                    return `
                        <div class="group flex items-start gap-3 p-4 rounded-xl border transition-all duration-200 ${cardStyle}">
                            <button onclick="toggleTask('${task.id}')" class="mt-0.5 shrink-0 text-slate-300 hover:text-indigo-500 transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
                            </button>
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-wrap items-start justify-between gap-2 mb-1">
                                    <h3 class="font-semibold text-base break-words pr-2 ${timeStatus === 'expired' ? 'text-red-900' : 'text-slate-800'}">${escapeHtml(task.title)}</h3>
                                    <span class="shrink-0 inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-bold ${badgeStyle}">
                                        ${timeText}
                                    </span>
                                </div>
                                ${task.memo ? `<p class="text-sm text-slate-500 mb-2 truncate">${escapeHtml(task.memo)}</p>` : ''}
                                <div class="flex items-center text-xs text-slate-400 font-medium">
                                    ${new Date(task.dueAt).toLocaleString('ja-JP', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                </div>
                            </div>
                            <div class="flex flex-col gap-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="openEditModal('${task.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors" title="編集">✏️</button>
                                <button onclick="deleteTask('${task.id}')" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors" title="削除">🗑️</button>
                            </div>
                        </div>`;
                }).join('');
            }

            // 完了済みセクションの描画
            const completedSection = document.getElementById('completed-section')!;
            if (completed.length > 0) {
                completedSection.classList.remove('hidden');
                document.getElementById('completed-count-label')!.textContent = `完了済みタスク (${completed.length})`;
                document.getElementById('completed-task-list')!.innerHTML = completed.map(task => `
                    <div class="flex items-center gap-3 p-3 bg-white/50 rounded-lg border border-transparent hover:border-slate-200 group">
                        <button onclick="toggleTask('${task.id}')" class="text-indigo-500 shrink-0 hover:text-slate-400 transition-colors">✅</button>
                        <div class="flex-1 min-w-0 opacity-60">
                            <h3 class="line-through text-slate-600 truncate">${escapeHtml(task.title)}</h3>
                        </div>
                        <button onclick="deleteTask('${task.id}')" class="p-1.5 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all shrink-0">🗑️</button>
                    </div>`).join('');
            } else {
                completedSection.classList.add('hidden');
            }

            // 通知バッジの描画
            const unreadCount = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notification-badge')!;
            if (unreadCount > 0) {
                badge.textContent = unreadCount.toString();
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // 通知リストの描画
            const notifListEl = document.getElementById('notification-list')!;
            if (notifications.length === 0) {
                notifListEl.innerHTML = `<div class="p-4 text-center text-sm text-slate-500">通知はありません</div>`;
            } else {
                notifListEl.innerHTML = notifications.map(n => `
                    <div class="p-4 border-b border-slate-50 text-sm ${n.read ? 'opacity-70' : 'bg-blue-50/50'}">
                        <div class="flex items-start gap-2">
                            <div>
                                <p class="text-slate-700">${escapeHtml(n.message)}</p>
                                <span class="text-xs text-slate-400 mt-1 block">${new Date(n.createdAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                        </div>
                    </div>`).join('');
            }
        }

        function escapeHtml(str: string): string {
            return str.replace(/[&<>"\']instagood/g, (tag) => {
                const chars: {[key: string]: string} = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return chars[tag] || tag;
            });
        }

        // 初回描画
        render();
    </script>
</body>
</html>
