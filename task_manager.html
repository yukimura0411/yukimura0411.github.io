<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルタスク管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <span>📝</span> タスクマネージャー
      </h1>
      <!-- 通知ベル -->
      <div class="relative">
        <button id="notification-bell" class="p-2 rounded-full hover:bg-gray-100 relative focus:outline-none">
          🔔
          <span id="notification-badge" class="absolute top-0 right-0 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>
        <!-- 通知ドロップダウン -->
        <div id="notification-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl border border-gray-100 z-20 overflow-hidden">
          <div class="bg-gray-50 px-4 py-2 border-b text-xs font-semibold text-gray-500">通知バナー</div>
          <div id="notification-list" class="max-h-60 overflow-y-auto divide-y divide-gray-100">
            <div class="p-4 text-xs text-gray-400 text-center">通知はありません</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-2xl w-full mx-auto px-4 py-6 flex-grow space-y-6">

    <!-- PWAインストール案内バナー (スマホ用) -->
    <div id="pwa-install-banner" class="hidden bg-blue-50 border border-blue-200 p-4 rounded-xl flex items-center justify-between gap-3">
      <div class="text-xs text-blue-800">
        <p class="font-bold">アプリとしてホーム画面に追加</p>
        <p class="mt-0.5">Safari/Chromeのメニューから「ホーム画面に追加」を行うと、全画面アプリとして快適に使えます。</p>
      </div>
      <button id="dismiss-banner" class="text-blue-500 hover:text-blue-700 text-xs font-bold px-2 py-1">✕</button>
    </div>

    <!-- タスク追加フォーム -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-sm font-semibold text-gray-700 mb-3">新しいタスクを追加</h2>
      <form id="task-form" class="space-y-3">
        <div>
          <input type="text" id="task-title" required placeholder="タスクのタイトル (必須)" maxlength="100"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex gap-2">
          <div class="flex-1">
            <input type="datetime-local" id="task-due" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shrink-0">
            追加
          </button>
        </div>
        <div>
          <textarea id="task-memo" placeholder="メモ (任意)" rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </form>
    </section>

    <!-- 未完了タスク一覧 -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-gray-700">未完了タスク</h2>
        <button id="request-permission-btn" class="text-xs text-blue-600 hover:underline hidden">
          🔔 ブラウザ通知を有効にする
        </button>
      </div>
      <div id="active-task-list" class="space-y-2">
        <!-- JSで動的に挿入 -->
      </div>
    </section>

    <!-- 完了済みタスク（折りたたみ） -->
    <section class="border border-gray-200 rounded-xl overflow-hidden bg-white shadow-sm">
      <button id="toggle-completed-btn" class="w-full px-4 py-3 bg-gray-50 flex justify-between items-center text-sm font-semibold text-gray-600 hover:bg-gray-100 transition">
        <span id="completed-header-text">完了済みタスク (0)</span>
        <span id="completed-arrow" class="transform transition-transform">▼</span>
      </button>
      <div id="completed-container" class="hidden p-4 space-y-2 border-t border-gray-100">
        <div id="completed-task-list" class="space-y-2">
          <!-- JSで動的に挿入 -->
        </div>
      </div>
    </section>

  </main>

  <!-- 編集モーダル -->
  <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-900">タスクの編集</h3>
      <form id="edit-form" class="space-y-3">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">タイトル</label>
          <input type="text" id="edit-title" required maxlength="100"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">締め切り日時</label>
          <input type="datetime-local" id="edit-due" required
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">メモ</label>
          <textarea id="edit-memo" rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="edit-cancel-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">
            キャンセル
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">
            保存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプト -->
  <script>
    // Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered: ', reg))
          .catch(err => console.log('ServiceWorker registration failed: ', err));
      });
    }

    const STORAGE_KEY = 'simple_tasks_v2';
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let showCompleted = false;

    // DOM要素
    const taskForm = document.getElementById('task-form');
    const taskTitleInput = document.getElementById('task-title');
    const taskDueInput = document.getElementById('task-due');
    const taskMemoInput = document.getElementById('task-memo');
    const activeTaskList = document.getElementById('active-task-list');
    const completedTaskList = document.getElementById('completed-task-list');
    const toggleCompletedBtn = document.getElementById('toggle-completed-btn');
    const completedContainer = document.getElementById('completed-container');
    const completedHeaderText = document.getElementById('completed-header-text');
    const completedArrow = document.getElementById('completed-arrow');
    
    const editModal = document.getElementById('edit-modal');
    const editForm = document.getElementById('edit-form');
    const editIdInput = document.getElementById('edit-id');
    const editTitleInput = document.getElementById('edit-title');
    const editDueInput = document.getElementById('edit-due');
    const editMemoInput = document.getElementById('edit-memo');
    const editCancelBtn = document.getElementById('edit-cancel-btn');

    const notificationBell = document.getElementById('notification-bell');
    const notificationBadge = document.getElementById('notification-badge');
    const notificationDropdown = document.getElementById('notification-dropdown');
    const notificationList = document.getElementById('notification-list');
    const requestPermissionBtn = document.getElementById('request-permission-btn');

    function init() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      taskDueInput.value = formatDateTimeLocal(now);

      setupEventListeners();
      render();
      checkNotificationPermission();

      setInterval(() => {
        render();
        checkReminders();
      }, 60000);
    }

    function formatDateTimeLocal(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function setupEventListeners() {
      taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = taskTitleInput.value.trim();
        const dueAt = taskDueInput.value;
        const memo = taskMemoInput.value.trim();
        if (!title || !dueAt) return;

        tasks.push({
          id: '_' + Math.random().toString(36).substr(2, 9),
          title, memo, dueAt,
          completed: false,
          completedAt: null,
          remindBefore: [1440, 60],
          notified: [],
          createdAt: new Date().toISOString()
        });
        saveAndRender();
        taskTitleInput.value = '';
        taskMemoInput.value = '';
      });

      toggleCompletedBtn.addEventListener('click', () => {
        showCompleted = !showCompleted;
        completedContainer.classList.toggle('hidden', !showCompleted);
        completedArrow.classList.toggle('rotate-180', showCompleted);
      });

      editCancelBtn.addEventListener('click', () => editModal.classList.add('hidden'));

      editForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const task = tasks.find(t => t.id === editIdInput.value);
        if (task) {
          task.title = editTitleInput.value.trim();
          task.dueAt = editDueInput.value;
          task.memo = editMemoInput.value.trim();
          saveAndRender();
          editModal.classList.add('hidden');
        }
      });

      notificationBell.addEventListener('click', () => notificationDropdown.classList.toggle('hidden'));
      window.addEventListener('click', (e) => {
        if (!notificationBell.contains(e.target) && !notificationDropdown.contains(e.target)) {
          notificationDropdown.classList.add('hidden');
        }
      });

      requestPermissionBtn.addEventListener('click', () => {
        if ('Notification' in window) {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              requestPermissionBtn.classList.add('hidden');
              new Notification('通知が有効化されました', { body: '期限が近づいたタスクをお知らせします。' });
            }
          });
        }
      });
    }

    function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    function saveAndRender() { saveTasks(); render(); }

    function getRemainingTimeText(dueAtStr) {
      const now = new Date();
      const due = new Date(dueAtStr);
      const diffMinutes = Math.floor((due.getTime() - now.getTime()) / (1000 * 60));

      if (diffMinutes < 0) {
        const absMin = Math.abs(diffMinutes);
        const hours = Math.floor(absMin / 60);
        const days = Math.floor(hours / 24);
        if (days > 0) return `期限切れ (${days}日前)`;
        if (hours > 0) return `期限切れ (${hours}時間前)`;
        return `期限切れ (${absMin}分前)`;
      }

      const days = Math.floor(diffMinutes / (60 * 24));
      const hours = Math.floor((diffMinutes % (60 * 24)) / 60);
      const minutes = diffMinutes % 60;
      if (days > 0) return `あと ${days}日 ${hours}時間`;
      if (hours > 0) return `あと ${hours}時間 ${minutes}分`;
      return `あと ${minutes}分`;
    }

    function render() {
      const activeTasks = tasks.filter(t => !t.completed).sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt));
      const completedTasks = tasks.filter(t => t.completed).sort((a, b) => new Date(b.completedAt || 0) - new Date(a.completedAt || 0));

      activeTaskList.innerHTML = activeTasks.length === 0 ? 
        `<div class="p-6 bg-white rounded-xl border border-gray-100 text-center text-sm text-gray-400">タスクはありません</div>` :
        activeTasks.map(task => {
          const isOverdue = new Date(task.dueAt).getTime() < Date.now();
          const timeText = getRemainingTimeText(task.dueAt);
          let badgeClass = isOverdue ? 'bg-red-50 text-red-700 border-red-200 font-bold' : 'bg-blue-50 text-blue-700 border-blue-100';
          if (!isOverdue && (new Date(task.dueAt) - Date.now()) <= 24 * 3600 * 1000) {
            badgeClass = 'bg-orange-50 text-orange-700 border-orange-200';
          }

          return `
            <div class="bg-white p-4 rounded-xl shadow-sm border ${isOverdue ? 'border-red-300 bg-red-50/20' : 'border-gray-100'} flex items-start justify-between gap-3">
              <div class="flex items-start gap-3 flex-grow min-w-0">
                <input type="checkbox" onchange="toggleTask('${task.id}')" class="mt-1 w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer">
                <div class="space-y-1 flex-grow min-w-0">
                  <h3 class="text-sm font-medium text-gray-900 break-words">${escapeHTML(task.title)}</h3>${task.memo ? `<p class="text-xs text-gray-500 break-words">${escapeHTML(task.memo)}</p>` : ''}
                  <div class="flex flex-wrap items-center gap-2 pt-1">
                    <span class="text-xs px-2 py-0.5 rounded-md border ${badgeClass}">${timeText}</span>
                    <span class="text-xs text-gray-400">期限: ${formatDisplayDate(task.dueAt)}</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="openEditModal('${task.id}')" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-lg text-xs">編集</button>
                <button onclick="deleteTask('${task.id}')" class="p-1.5 text-gray-400 hover:text-red-600 rounded-lg text-xs">削除</button>
              </div>
            </div>
          `;
        }).join('');

      completedHeaderText.textContent = `完了済みタスク (${completedTasks.length})`;
      completedTaskList.innerHTML = completedTasks.length === 0 ?
        `<div class="text-xs text-gray-400 text-center py-2">完了したタスクはありません</div>` :
        completedTasks.map(task => `
          <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-grow min-w-0">
              <input type="checkbox" checked onchange="toggleTask('${task.id}')" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer">
              <span class="text-sm text-gray-400 line-through break-words">${escapeHTML(task.title)}</span>
            </div>
            <button onclick="deleteTask('${task.id}')" class="p-1 text-gray-400 hover:text-red-600 text-xs shrink-0">削除</button>
          </div>
        `).join('');

      updateNotificationUI();
    }

    function formatDisplayDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'`"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.toggleTask = function(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        task.completedAt = task.completed ? new Date().toISOString() : null;
        saveAndRender();
      }
    };

    window.deleteTask = function(id) {
      if (confirm('このタスクを削除しますか？')) {
        tasks = tasks.filter(t => t.id !== id);
        saveAndRender();
      }
    };

    window.openEditModal = function(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        editIdInput.value = task.id;
        editTitleInput.value = task.title;
        editDueInput.value = task.dueAt;
        editMemoInput.value = task.memo || '';
        editModal.classList.remove('hidden');
      }
    };

    function checkReminders() {
      const now = Date.now();
      let updated = false;

      tasks.forEach(task => {
        if (task.completed) return;
        const dueTime = new Date(task.dueAt).getTime();
        const diffMinutes = Math.floor((dueTime - now) / (1000 * 60));

        task.remindBefore.forEach(min => {
          if (diffMinutes <= min && diffMinutes > min - 2 && !task.notified.includes(min)) {
            task.notified.push(min);
            updated = true;
            triggerNotification(task, min);
          }
        });
      });

      if (updated) saveTasks();
    }

    function triggerNotification(task, min) {
      const timeStr = min >= 1440 ? `${Math.floor(min / 1440)}日前` : `${Math.floor(min / 60)}時間前`;
      const message = `「${task.title}」の締め切りが ${timeStr} です！`;

      if ('Notification' in window && Notification.permission === 'granted') {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification('タスクのリマインド', { body: message, icon: './icon.png' });
          });
        } else {
          new Notification('タスクのリマインド', { body: message });
        }
      }
    }

    function checkNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        requestPermissionBtn.classList.remove('hidden');
      }
    }

    function updateNotificationUI() {
      const now = Date.now();
      const alerts = tasks.filter(t => !t.completed && new Date(t.dueAt).getTime() - now < 24 * 60 * 60 * 1000);

      if (alerts.length > 0) {
        notificationBadge.textContent = alerts.length;
        notificationBadge.classList.remove('hidden');
        notificationList.innerHTML = alerts.map(t => `
          <div class="p-3 text-xs hover:bg-gray-50">
            <p class="font-medium text-gray-800">${escapeHTML(t.title)}</p>
            <p class="text-red-600 font-semibold mt-0.5">${getRemainingTimeText(t.dueAt)}</p>
          </div>
        `).join('');
      } else {
        notificationBadge.classList.add('hidden');
        notificationList.innerHTML = `<div class="p-4 text-xs text-gray-400 text-center">通知はありません</div>`;
      }
    }

    init();
  </script>
</body>
</html>
